name: Build LogeAchi Dotcom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE"

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find . -name gradlew -type f -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Project directory: $PROJECT_DIR"
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          find . -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LogeAchi-Dotcom-debug-APK
          path: '**/build/outputs/apk/debug
